name: Billing and recovery tests
on:
  pull_request:
  push:
    branches: [fix/render-recovery]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: walvr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --prefix "$RUNNER_TEMP/walvr-test" --no-audit --no-fund pg@8.16.3 @electric-sql/pglite@0.3.14
      - run: node --test tests/*.test.cjs
      - run: npx tsc --noEmit
      - run: node tests/billing-migration.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/walvr-test/node_modules
      - run: node tests/billing-concurrency.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/walvr-test/node_modules
          WALVR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/walvr_test
